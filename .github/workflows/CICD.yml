name: CI-CD

on:
  push:

jobs:
  test:
    runs-on: self-hosted
    env:
      URLBDD: ${{ secrets.URLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: python -m pytest --cov=main --cov-report=term-missing --cov-report=xml

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    needs: test
    runs-on: self-hosted
    timeout-minutes: 720
    concurrency:
      group: uvicorn
      cancel-in-progress: true
    env:
      URLBDD: ${{ secrets.URLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer l'API
        run: python -m uvicorn main:app --host 127.0.0.1 --port 8000

name: CI-CD

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      DATABASE_URL: ${{ secrets.URLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    timeout-minutes: 720
    concurrency:
      group: uvicorn-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      DATABASE_URL: ${{ secrets.URLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer l'API
        run: python -m uvicorn main:app --host 127.0.0.1 --port ${{ github.ref_name == 'main' && '8000' || '8001' }}
